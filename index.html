<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPHelper — Fishing Planet reference</title>
<style>
  :root{
    --deep:#0b1f26;
    --deep2:#0f2a33;
    --panel:#12313b;
    --panel-line:#1e4552;
    --ink:#eaf3f0;
    --ink-dim:#9fbcb8;
    --amber:#e8a33d;
    --amber-dim:#c9863f;
    --line:#e8a33d33;
    --font-display: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a4048 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #12323c 0%, transparent 55%),
      radial-gradient(700px 500px at 85% 95%, #3a2a1440 0%, transparent 60%),
      radial-gradient(600px 420px at 5% 90%, #2c1f1030 0%, transparent 55%),
      var(--deep);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    position:relative;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(ellipse at 50% 0%, transparent 40%, #05100f66 100%);
  }
  a{color:inherit;}
  ::selection{background:var(--amber); color:#0b1f26;}

  .ripples{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.10;
    background-image:
      repeating-radial-gradient(circle at 20% 30%, transparent 0 40px, #ffffff10 41px 42px, transparent 43px 90px),
      repeating-radial-gradient(circle at 80% 75%, transparent 0 60px, #ffffff0c 61px 62px, transparent 63px 130px);
    animation: drift 40s linear infinite;
  }
  .fireflies{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(2px 2px at 12% 22%, #e8a33d99 0%, transparent 60%),
      radial-gradient(2px 2px at 78% 15%, #e8a33d66 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 34% 68%, #e8c94d88 0%, transparent 60%),
      radial-gradient(2px 2px at 62% 82%, #e8a33d55 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 90% 55%, #e8c94d77 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 8% 85%, #e8a33d66 0%, transparent 60%);
    animation: driftSlow 50s ease-in-out infinite alternate;
  }
  @keyframes driftSlow{ from{ transform:translateY(0);} to{ transform:translateY(-24px);} }
  @keyframes drift{ from{background-position:0 0,0 0;} to{background-position:200px 100px,-160px -140px;} }

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, #0d242bee, #0d242bcc 80%, transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--panel-line);
    padding:14px 20px 0 20px;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; max-width:1180px; margin:0 auto; padding-bottom:12px;
  }
  .brand .mark{font-size:22px;}
  .brand h1{
    font-family:var(--font-display); font-weight:600; font-size:22px; letter-spacing:.02em;
    margin:0; color:var(--ink);
  }
  .brand .sub{
    font-size:12px; color:var(--ink-dim); font-family:var(--font-mono); letter-spacing:.03em;
    margin-left:auto; text-align:right;
  }
  nav.tabs{
    max-width:1180px; margin:0 auto; display:flex; gap:2px;
  }
  nav.tabs button{
    background:transparent; border:none; color:var(--ink-dim);
    font-family:var(--font-mono); font-size:14px; letter-spacing:.06em; text-transform:uppercase;
    padding:10px 20px; cursor:pointer; white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{color:var(--amber); border-bottom-color:var(--amber);}

  main{max-width:1180px; margin:0 auto; padding:22px 20px 80px; position:relative; z-index:1;}

  .toolbar{
    display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;
  }
  .search{
    flex:1; min-width:220px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:3px;
    padding:10px 14px; color:var(--ink); font-family:var(--font-body); font-size:14px;
  }
  .search:focus{outline:none; border-color:var(--amber);}
  select.filter{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:3px;
    padding:10px 12px; color:var(--ink-dim); font-family:var(--font-mono); font-size:12.5px;
  }
  .count-tag{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);
    border:1px solid var(--panel-line); padding:6px 10px; border-radius:20px; white-space:nowrap;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px;
  }
  .card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:4px;
    overflow:hidden; cursor:pointer; text-align:left;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-2px); border-color:var(--amber-dim); box-shadow:0 8px 22px #00000055;}
  .card .thumb{
    aspect-ratio:1/1; background:#0a1e24; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .card.wide .thumb{aspect-ratio:16/10;}
  .card .thumb img{width:100%; height:100%; object-fit:contain; padding:10px;}
  .card.wide .thumb img{object-fit:cover; padding:0;}
  .card .thumb .ph{color:var(--panel-line); font-size:11px; font-family:var(--font-mono);}
  .card .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1;}
  .card .title{font-family:var(--font-display); font-size:15px; font-weight:600; line-height:1.25;}
  .card .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:.02em;}
  .card .bites{font-size:12px; color:#cfe4de; margin-top:2px; line-height:1.4;}
  .card .bites b{color:var(--amber); font-weight:600;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-dim); font-family:var(--font-mono); font-size:13px;
  }

  .overlay{
    position:fixed; inset:0; background:#050f13cc; backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px;
    overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .detail{
    background:var(--deep2); border:1px solid var(--panel-line); border-radius:6px;
    max-width:980px; width:100%; overflow:hidden;
    box-shadow:0 30px 70px #000000aa;
  }
  .detail .hero{
    display:flex; gap:20px; padding:26px; background:linear-gradient(135deg,#123039,#0d2229);
    border-bottom:1px solid var(--panel-line); position:relative;
  }
  .detail .hero img{width:150px; height:150px; object-fit:contain; background:#08181d; border-radius:4px; padding:8px; flex-shrink:0;}
  .detail .hero .htext{flex:1; min-width:0;}
  .detail .hero h2{font-family:var(--font-display); font-size:26px; margin:0 0 4px;}
  .detail .hero .latin{font-style:italic; color:var(--ink-dim); font-size:13.5px; margin-bottom:10px;}
  .detail .hero .stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
  .detail .hero .stat{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);}
  .detail .hero .stat b{color:var(--amber); display:block; font-size:14px; font-family:var(--font-body);}
  .detail .close, .back-btn{
    position:absolute; top:14px; z-index:6;
    width:32px; height:32px; border-radius:50%;
    background:#0b1f26b0; backdrop-filter:blur(4px);
    border:1px solid #ffffff1a; color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; line-height:1; font-size:17px;
    transition:background .15s, border-color .15s, color .15s, transform .1s;
  }
  .detail .close{ right:14px; font-size:20px; }
  .back-btn{ left:14px; display:none; }
  .detail .close:hover, .back-btn:hover{
    color:var(--amber); border-color:var(--amber-dim); background:#12313bd0; transform:scale(1.06);
  }
  .detail .close:active, .back-btn:active{ transform:scale(0.94); }
  .detail .content{padding:22px 26px 26px; font-size:14.5px; line-height:1.65; color:#d7e6e2;}
  .detail .content p{margin:0 0 12px;}
  .detail h3.section{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--amber); margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .detail h3.section:first-of-type{border-top:none; margin-top:4px;}
  .detail h3.section .n{color:var(--ink-dim); font-weight:400; text-transform:none; letter-spacing:0;}

  .spec-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;}
  .spec-card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:4px; padding:10px; cursor:pointer;
    display:flex; gap:10px; align-items:center;
  }
  .spec-card:hover{border-color:var(--amber-dim);}
  .spec-card img{width:40px; height:40px; object-fit:contain; background:#08181d; border-radius:3px; flex-shrink:0;}
  .spec-card .noimg{width:40px; height:40px; border-radius:3px; background:#08181d; flex-shrink:0;}
  .spec-card .st{min-width:0;}
  .spec-card .st .nm{font-size:12.5px; font-weight:600; line-height:1.25; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .spec-card .st .sp{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); line-height:1.4;}
  .spec-card .st .sp b{color:var(--amber);}

  .rank-list{display:flex; flex-direction:column; gap:6px;}
  .rank-row{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--panel-line);
    border-radius:4px; padding:8px 12px;
  }
  .rank-row .num{font-family:var(--font-mono); color:var(--amber); font-size:12px; width:18px;}
  .rank-row .nm{flex:1; font-size:13px;}
  .rank-row .bar{height:5px; border-radius:3px; background:var(--amber-dim); opacity:.8;}
  .rank-row .cnt{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); width:50px; text-align:right;}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--panel-line);
    border-radius:20px; padding:5px 12px 5px 5px; font-size:12.5px; cursor:pointer;
  }
  .chip:hover{border-color:var(--amber-dim);}
  .chip img{width:26px; height:26px; object-fit:contain; border-radius:50%; background:#08181d;}
  .chip .noimg{width:26px; height:26px; border-radius:50%; background:#08181d;}

  .map-frame{position:relative; width:100%; height:min(72vh, 640px); min-height:320px; overflow:hidden; background:#050f13; touch-action:none;}
  .map-wrap{position:relative; width:100%; overflow:visible; line-height:0; transform-origin:0 0; cursor:grab;}
  .map-wrap.dragging{cursor:grabbing;}
  .map-wrap img{width:100% !important; height:auto !important; object-fit:contain !important; display:block !important; padding:0 !important; background:none !important; border-radius:0 !important; pointer-events:none; -webkit-user-drag:none;}
  .zoom-controls{position:absolute; right:10px; bottom:10px; z-index:6; display:flex; flex-direction:column; gap:4px;}
  .zoom-controls button{
    width:28px; height:28px; border-radius:4px; border:1px solid var(--panel-line); background:#0d242bdd;
    color:var(--ink); font-size:15px; cursor:pointer; line-height:1;
  }
  .zoom-controls button:hover{border-color:var(--amber-dim); color:var(--amber);}
  .pin{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:#9aa5a3; border:1.5px solid #0b1f26; box-shadow:0 0 0 1px #ffffff33;
    transform:translate(-50%,-50%); cursor:pointer; transition:transform .1s;
  }
  .pin:hover{ transform:translate(-50%,-50%) scale(1.6); z-index:5; }
  .pin.trophy{ background:#4caf6a; box-shadow:0 0 0 1px #4caf6a55; }
  .pin.unique{ background:#e8c94d; box-shadow:0 0 0 1px #e8c94d55; }
  .pin-tip{
    position:fixed; z-index:50; pointer-events:none; display:none;
    background:#0b1f26f0; border:1px solid var(--panel-line); border-radius:6px;
    padding:6px 10px 6px 6px; display:none; align-items:center; gap:8px;
    box-shadow:0 8px 20px #00000066; transform:translate(-50%,-115%);
  }
  .pin-tip img{ width:32px; height:32px; object-fit:contain; background:#08181d; border-radius:4px; }
  .pin-tip .noimg{ width:32px; height:32px; border-radius:4px; background:#08181d; }
  .pin-tip .nm{ font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .pin-tip .ty{ font-size:10px; font-family:var(--font-mono); color:var(--ink-dim); text-transform:capitalize; }

  footer{
    max-width:1180px; margin:40px auto 0; padding:20px; color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; border-top:1px solid var(--panel-line); text-align:center;
  }
  .banner{
    max-width:1180px; margin:0 auto 18px; padding:12px 16px; border:1px dashed var(--panel-line);
    border-radius:4px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); line-height:1.6;
  }
  .banner b{color:var(--amber);}

  @media (max-width:560px){
    .brand .sub{display:none;}
    .detail .hero{flex-direction:column;}
    .detail .hero img{width:110px; height:110px;}
  }
</style>
</head>

<div class="ripples"></div>
<div class="fireflies"></div>

<header>
  <div class="brand">
    <span class="mark">&#127907;</span>
    <h1>FPHelper <span style="color:var(--ink-dim); font-weight:400;">/ Fishing Planet reference</span></h1>
    <span class="sub" id="metaLine">loading...</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="fish" class="active">Fish</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="tackle">Tackle</button>
    <button data-tab="places">Maps</button>
    <button data-tab="trends">Trends</button>
  </nav>
</header>

<main>

  <div class="toolbar">
    <input class="search" id="searchBox" type="text" placeholder="Search...">

    <select class="filter" id="mapFishFilter" style="display:none;"></select>
    <input class="filter" id="mapWeightMin" type="number" step="0.1" min="0" placeholder="min kg" style="display:none; width:80px;">
    <input class="filter" id="mapWeightMax" type="number" step="0.1" min="0" placeholder="max kg" style="display:none; width:80px;">
    <span class="count-tag" id="countTag"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">Nothing found.</div>
  <div id="extraPanel"></div>
</main>

<footer>FPHelper — offline-friendly Fishing Planet reference &middot; data sourced from the fp-collective.com API export &middot; images load from the internet when available</footer>

<div class="pin-tip" id="pinTip"><img id="pinTipImg" style="display:none;"><div class="noimg" id="pinTipNoImg" style="display:none;"></div><div><div class="nm" id="pinTipName"></div><div class="ty" id="pinTipType"></div></div></div>
<div class="overlay" id="overlay">
  <div class="detail" id="detailBox"></div>
</div>

let DATA = null;
let byId = {};
let state = { tab:'fish', query:'', filter:'', mapFishId:'', mapWeightMin:'', mapWeightMax:'' };

fetch('data.json').then(r=>r.json()).then(d=>{
  DATA = d;
  ['fish','baits','lures','hooks','luretypes','places','jigheads','boilies','sinkers','keepnets'].forEach(k=>{
    byId[k] = {};
    (DATA[k]||[]).forEach(item=>{ byId[k][item.id] = item; });
  });
  // unified gear list: every piece of tackle, tagged with its category, sorted by level
  const gearDefs = [
    ['baits','Bait'], ['lures','Lure'], ['hooks','Hook'], ['jigheads','Jighead'],
    ['boilies','Boilie / Pellet'], ['sinkers','Sinker'], ['keepnets','Keepnet / Stringer'],
  ];
  DATA.gear = [];
  gearDefs.forEach(([key,label])=>{
    (DATA[key]||[]).forEach(item=>{
      DATA.gear.push(Object.assign({}, item, {kind:label, kindKey:key, level: item.baseLevel||0}));
    });
  });
  DATA.gear.sort((a,b)=> (a.level-b.level) || a.title.localeCompare(b.title));
  byId.gearItems = {};
  DATA.gear.forEach(g=>{
    if(!byId.gearItems[g.kindKey]) byId.gearItems[g.kindKey] = {};
    byId.gearItems[g.kindKey][g.id] = g;
  });
  DATA.places = (DATA.places||[]).slice().sort((a,b)=> (a.baseLevel||0)-(b.baseLevel||0));
  DATA.tackle = TACKLE_DATA.map(t=>Object.assign({title:t.series}, t));
  byId.tackle = {};
  DATA.tackle.forEach(t=>{ byId.tackle[t.id] = t; });
  init();
}).catch(err=>{
  document.getElementById('grid').innerHTML =
    `<div class="empty">Could not load data.json. Serve this folder with a local web server (opening index.html directly via file:// blocks fetch()). Error: ${err}</div>`;
});

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function placeholderThumb(){ return `<div class="ph">no image</div>`; }
function imgTag(url, alt, style){
  if(!url) return placeholderThumb();
  const st = style?` style="${style}"`:'';
  return `<img src="${url}" alt="${escapeHtml(alt||'')}" loading="lazy"${st} onerror="this.parentElement.innerHTML=placeholderThumb()">`;
}
function uniqueVals(arr, field){
  const s = new Set();
  arr.forEach(x=>{ if(x[field]) s.add(x[field]); });
  return Array.from(s).sort();
}

// ---- derive per-fish stats: bait/lure names for card preview, most-used lure types ----
function topNames(tab, ids, n){
  return (ids||[]).slice(0,n).map(id=> byId[tab][id]? byId[tab][id].title : null).filter(Boolean);
}
function parseOpenKey(s){
  const parts = s.split(':');
  if(parts[0]==='gear') return {tab:'gear', kindKey:parts[1], id:Number(parts[2])};
  return {tab:parts[0], id:Number(parts[1])};
}
function bindOpenHandlers(root){
  root.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ const k = parseOpenKey(el.dataset.open); openDetail(k.tab, k.id, k.kindKey); };
  });
}

function renderTabs(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });
}

function filterOptionsFor(tab){
  if(tab==='places') return uniqueVals(DATA.places,'type');
  if(tab==='gear') return Array.from(new Set(DATA.gear.map(g=>g.kind)));
  return [];
}
function renderFilter(){
  const sel = document.getElementById('filterSelect');
  const opts = filterOptionsFor(state.tab);
  if(opts.length===0){ sel.style.display='none'; return; }
  sel.style.display='';
  sel.innerHTML = `<option value="">all types</option>` + opts.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
  sel.value = state.filter;
  sel.onchange = ()=>{ state.filter = sel.value; render(); };
}

function matchesQuery(item, q){
  if(!q) return true;
  const hay = (item.title||'') + ' ' + (item.latinName||'') + ' ' + (item.locationName||'');
  return hay.toLowerCase().includes(q.toLowerCase());
}
function matchesFilter(item, tab, f){
  if(!f) return true;
  if(tab==='places') return item.type===f;
  if(tab==='gear') return item.kind===f;
  return true;
}

function cardFor(tab, item){
  if(tab==='fish'){
    const baitNames = topNames('baits', item.baitIds, 3);
    const lureNames = topNames('luretypes', item.lureIds, 2);
    const bitesOn = [...baitNames, ...lureNames].slice(0,3);
    return `<div class="card" data-open="fish:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.latinName||'')}</div>
        ${bitesOn.length? `<div class="bites">Bites best on <b>${bitesOn.map(escapeHtml).join(', ')}</b></div>` : ''}
      </div>
    </div>`;
  }
  if(tab==='tackle'){
    return `<div class="card" data-open="tackle:${item.id}">
      <div class="thumb" style="background:linear-gradient(135deg,#173b45,#0d2229); display:flex; align-items:center; justify-content:center;"><span style="font-size:34px; opacity:.55; filter:grayscale(.2);">&#127907;</span></div>
      <div class="body">
        <div class="title">${escapeHtml(item.series)} <span style="color:var(--ink-dim); font-weight:400;">${item.cm}cm</span></div>
        <div class="meta">${escapeHtml(item.power)} &middot; level ${escapeHtml(String(item.level))}</div>
        <div class="bites">Lure ${escapeHtml(item.lureG)} g &middot; line ${escapeHtml(item.lineKg)} kg</div>
        <div class="tag" style="align-self:flex-start; font-family:var(--font-mono); font-size:10px; color:var(--amber); border:1px solid var(--line); padding:2px 7px; border-radius:20px; margin-top:auto;">${escapeHtml(item.action)}</div>
      </div>
    </div>`;
  }
  if(tab==='places'){
    const previewFish = (item.fishIds||[]).slice(0,3).map(id=> byId.fish[id]? byId.fish[id].title : null).filter(Boolean);
    const cardMapSrc = svgMapFor(item.slug) || item.image;
    return `<div class="card wide" data-open="places:${item.id}">
      <div class="thumb">${imgTag(cardMapSrc, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.locationName||'')}${item.type?' &middot; '+escapeHtml(item.type):''}</div>
        <div class="bites">${(item.fishIds||[]).length} fish species &middot; ${(item.monsterFishIds||[]).length} trophy fish</div>
        ${previewFish.length? `<div class="bites">Catches: <b>${previewFish.map(escapeHtml).join(', ')}</b>${(item.fishIds||[]).length>3?'…':''}</div>` : ''}
        ${item.baseLevel? `<div class="tag" style="align-self:flex-start; font-family:var(--font-mono); font-size:10px; color:var(--amber); border:1px solid var(--line); padding:2px 7px; border-radius:20px; margin-top:4px;">Lv. ${item.baseLevel}</div>`:''}
      </div>
    </div>`;
  }
  if(tab==='gear'){
    const specs = [];
    if(item.weight) specs.push(`${item.weight}${item.kindKey==='lures'||item.kindKey==='jigheads'?'g':''}`);
    if(item.length) specs.push(`${item.length}cm`);
    if(item.hookSize) specs.push(`hook ${item.hookSize}`);
    if(item.size) specs.push(item.size);
    return `<div class="card" data-open="gear:${item.kindKey}:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.kind)}${item.lureType?' &middot; '+escapeHtml(item.lureType):''}${item.baitType?' &middot; '+escapeHtml(item.baitType):''}</div>
        ${specs.length? `<div class="bites">${specs.map(escapeHtml).join(' &middot; ')}</div>`:''}
        <div class="tag" style="align-self:flex-start; font-family:var(--font-mono); font-size:10px; color:var(--amber); border:1px solid var(--line); padding:2px 7px; border-radius:20px; margin-top:auto;">Lv. ${item.level}</div>
      </div>
    </div>`;
  }
  return '';
}

function render(){
  renderTabs();
  const toolbar = document.querySelector('.toolbar');
  const grid = document.getElementById('grid');
  const extra = document.getElementById('extraPanel');
  const mapFishSel = document.getElementById('mapFishFilter');
  const mapMinInp = document.getElementById('mapWeightMin');
  const mapMaxInp = document.getElementById('mapWeightMax');
  if(state.tab==='trends'){
    toolbar.style.display='none';
    grid.style.display='none';
    document.getElementById('emptyMsg').style.display='none';
    extra.innerHTML = trendsHtml();
    bindOpenHandlers(extra);
    return;
  }
  toolbar.style.display='';
  grid.style.display='';
  renderFilter();

  const isMaps = state.tab==='places';
  mapFishSel.style.display = isMaps? '' : 'none';
  mapMinInp.style.display = isMaps? '' : 'none';
  mapMaxInp.style.display = isMaps? '' : 'none';
  if(isMaps && !mapFishSel.dataset.filled){
    const fishSorted = DATA.fish.slice().sort((a,b)=>a.title.localeCompare(b.title));
    mapFishSel.innerHTML = `<option value="">any fish</option>` + fishSorted.map(f=>`<option value="${f.id}">${escapeHtml(f.title)}</option>`).join('');
    mapFishSel.dataset.filled = '1';
    mapFishSel.onchange = ()=>{ state.mapFishId = mapFishSel.value; render(); };
    mapMinInp.oninput = ()=>{ state.mapWeightMin = mapMinInp.value; render(); };
    mapMaxInp.oninput = ()=>{ state.mapWeightMax = mapMaxInp.value; render(); };
  }
  if(isMaps){
    mapFishSel.value = state.mapFishId;
    mapMinInp.value = state.mapWeightMin;
    mapMaxInp.value = state.mapWeightMax;
  }

  let list = DATA[state.tab].filter(i => matchesQuery(i, state.query) && matchesFilter(i, state.tab, state.filter));
  if(isMaps && state.mapFishId){
    const fid = Number(state.mapFishId);
    const min = state.mapWeightMin!==''? parseFloat(state.mapWeightMin) : -Infinity;
    const max = state.mapWeightMax!==''? parseFloat(state.mapWeightMax) : Infinity;
    list = list.filter(p=>{
      const pins = (DATA.placePins && DATA.placePins[String(p.id)]) || [];
      return pins.some(pin=> pin.fishId===fid && (pin.weight==null || (pin.weight>=min && pin.weight<=max)));
    });
  }
  document.getElementById('countTag').textContent = `showing ${list.length} / ${DATA[state.tab].length}`;
  grid.innerHTML = list.map(i=>cardFor(state.tab,i)).join('');
  document.getElementById('emptyMsg').style.display = list.length? 'none':'block';
  bindOpenHandlers(grid);
  extra.innerHTML = '';
}

function trendsHtml(){
  const mk = DATA.meta.markers || {};
  function tallyAcrossFish(kind, catalogKey, n){
    const totals = {};
    Object.values(DATA.fishStats||{}).forEach(stat=>{
      (stat[kind]||[]).forEach(e=>{ totals[e.id] = (totals[e.id]||0) + e.count; });
    });
    return Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id,count])=>({id:Number(id), count, item: byId[catalogKey][Number(id)]}));
  }
  const topBaits = tallyAcrossFish('topBaits','baits',10);
  const topLures = tallyAcrossFish('topLures','lures',10);
  const topLureTypes = tallyAcrossFish('topLureTypes','luretypes',10);
  const topHooks = tallyAcrossFish('topHooks','hooks',10);
  const topFish = Object.entries(DATA.fishStats||{}).map(([id,s])=>({id:Number(id), count:s.totalCatches, item: byId.fish[Number(id)]}))
    .sort((a,b)=>b.count-a.count).slice(0,10);
  const topPlaces = DATA.places.map(p=>({item:p, count:(DATA.placePins[String(p.id)]||[]).length}))
    .sort((a,b)=>b.count-a.count).slice(0,10);
  function rankList(entries, openKind){
    if(!entries.length) return '<span style="color:var(--ink-dim); font-size:12.5px;">no data</span>';
    const max = entries[0].count || 1;
    return `<div class="rank-list">` + entries.map((e,i)=>{
      const it = e.item;
      const name = it? it.title : ('#'+e.id);
      const pct = Math.max(10, Math.round((e.count/max)*140));
      const openAttr = it && openKind ? ` data-open="${openKind}:${e.id}"` : '';
      return `<div class="rank-row"${openAttr} style="${it&&openKind?'cursor:pointer;':''}"><span class="num">${i+1}</span><span class="nm">${escapeHtml(name)}</span><span class="bar" style="width:${pct}px;"></span></div>`;
    }).join('') + `</div>`;
  }
  return `
    <div style="margin-top:6px;">
      <div class="banner" style="margin:0 0 20px;">
        <b>Game-wide trends</b> — the most popular gear and hotspots across the whole game, based on real play patterns.
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:24px;">
        <div><h3 class="section" style="margin-top:0;">Top baits overall</h3>${rankList(topBaits,'baits')}</div>
        <div><h3 class="section" style="margin-top:0;">Top lures overall</h3>${rankList(topLures,'lures')}</div>
        <div><h3 class="section" style="margin-top:0;">Top lure types overall</h3>${rankList(topLureTypes,null)}</div>
        <div><h3 class="section" style="margin-top:0;">Top hooks overall</h3>${rankList(topHooks,'hooks')}</div>
        <div><h3 class="section" style="margin-top:0;">Most popular fish</h3>${rankList(topFish,'fish')}</div>
        <div><h3 class="section" style="margin-top:0;">Busiest maps</h3>${rankList(topPlaces.map(p=>({id:p.item.id, count:p.count, item:p.item})),'places')}</div>
      </div>
    </div>
  `;
}

function specChipsBaits(ids){
  if(!ids || !ids.length) return '<span style="color:var(--ink-dim); font-size:12.5px;">none in this data set</span>';
  return `<div class="spec-grid">` + ids.map(id=>{
    const b = byId.baits[id];
    if(!b) return `<div class="spec-card"><div class="noimg"></div><div class="st"><div class="nm">#${id}</div><div class="sp">not loaded</div></div></div>`;
    const specs = [b.weight, b.baitType].filter(Boolean).join(' &middot; ');

function openDetail(tab, id, kindKey, isBack){

function initMapZoom(frame){
  const wrap = frame.querySelector('.map-wrap');
  const img = wrap && wrap.querySelector('img');
  if(!wrap) return;
  let baseScale=1, userZoom=1, panX=0, panY=0, dragging=false, lastX=0, lastY=0, moved=false;

  function metrics(){
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const nw = (img && img.naturalWidth) || fw, nh = (img && img.naturalHeight) || fh;
    return {fw, fh, nw, nh};
  }
  function computeBase(){
    const {fw, fh, nw, nh} = metrics();
    const contentH_at_1 = fw * (nh/nw); // wrap width == frame width at scale 1
    baseScale = contentH_at_1 > fh ? (fh / contentH_at_1) : 1;
  }
  function apply(){
    const {fw, fh, nw, nh} = metrics();
    const total = baseScale * userZoom;
    const contentW = fw * total;
    const contentH = fw * (nh/nw) * total;
    const centerX = (fw - contentW) / 2;
    const centerY = (fh - contentH) / 2;
    const overflowX = Math.max(0, contentW - fw), overflowY = Math.max(0, contentH - fh);
    const slack = 60;
    panX = Math.max(-(overflowX/2+slack), Math.min(overflowX/2+slack, panX));
    panY = Math.max(-(overflowY/2+slack), Math.min(overflowY/2+slack, panY));
    wrap.style.transformOrigin = '0 0';
    wrap.style.transform = `translate(${centerX+panX}px, ${centerY+panY}px) scale(${total})`;
  }
  function setZoom(nz){ userZoom = Math.max(1, Math.min(8, nz)); if(userZoom===1){panX=0; panY=0;} apply(); }
  function reset(){ userZoom=1; panX=0; panY=0; computeBase(); apply(); }

  if(img){
    if(img.complete && img.naturalWidth){ computeBase(); apply(); }
    img.addEventListener('load', ()=>{ computeBase(); apply(); });
  }
  window.addEventListener('resize', ()=>{ computeBase(); apply(); });
  apply();

  frame.addEventListener('wheel', e=>{ e.preventDefault(); setZoom(userZoom + (e.deltaY<0? 0.4 : -0.4)); }, {passive:false});
  wrap.addEventListener('mousedown', e=>{ dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; wrap.classList.add('dragging'); });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
    panX+=dx; panY+=dy; apply();
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('dragging'); });
  wrap.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); } });
  // touch support
  let lastDist=null;
  wrap.addEventListener('touchstart', e=>{
    if(e.touches.length===1){ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
    else if(e.touches.length===2){ lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
  }, {passive:true});
  wrap.addEventListener('touchmove', e=>{
    if(e.touches.length===1 && dragging){
      const dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY;
      lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
      panX+=dx; panY+=dy; apply();
    } else if(e.touches.length===2 && lastDist!=null){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      setZoom(userZoom * (d/lastDist)); lastDist = d;
    }
  }, {passive:true});
  wrap.addEventListener('touchend', ()=>{ dragging=false; lastDist=null; });
  frame.querySelectorAll('[data-zoom]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const z = btn.dataset.zoom;
      if(z==='in') setZoom(userZoom+0.6);
      else if(z==='out') setZoom(userZoom-0.6);
      else reset();
    };
  });
}

function parseKgUpper(range){
  if(!range) return 0;
  const parts = String(range).split('-').map(s=>parseFloat(s));
  return parts[parts.length-1] || 0;
}
function suggestRodForWeight(kg){
  if(!kg || !DATA.tackle || !DATA.tackle.length) return null;
  const withCap = DATA.tackle.map(t=>({t, cap:parseKgUpper(t.lineKg)}));
  const sufficient = withCap.filter(x=>x.cap>=kg).sort((a,b)=>a.cap-b.cap);

  return withCap.sort((a,b)=>b.cap-a.cap)[0].t; // heaviest available if nothing rated high enough
}

function spreadOverlappingPins(pins){
  const groups = {};
  pins.forEach(p=>{
    const key = Math.round(p.x*8)+'_'+Math.round(p.y*8);
    (groups[key]=groups[key]||[]).push(p);
  });
  const out = [];
  Object.values(groups).forEach(group=>{
    if(group.length===1){ out.push(group[0]); return; }
    const cx = group.reduce((s,p)=>s+p.x,0)/group.length;
    const cy = group.reduce((s,p)=>s+p.y,0)/group.length;
    const radius = Math.min(1.4, 0.35 + group.length*0.05);
    group.forEach((p,i)=>{
      const angle = (2*Math.PI*i)/group.length;
      out.push(Object.assign({}, p, {x: Math.max(0,Math.min(100, cx + radius*Math.cos(angle))), y: Math.max(0,Math.min(100, cy + radius*Math.sin(angle)))}));
    });
  });
  return out;
}

    const fd = (item.fishDetails||[]).find(x=>x.id===id);
    const local = byId.fish[id];
    const title = local? local.title : (fd? fd.name : ('#'+id));
    const img = local? local.image : '';
    const weight = fd && fd.max_weight ? ` <span style="opacity:.6;">up to ${fd.max_weight}kg</span>` : '';
    if(local) return `<div class="chip" data-open="fish:${id}">${img?`<img src="${img}">`:`<div class="noimg"></div>`}${escapeHtml(title)}${weight}</div>`;
    return `<div class="chip"><div class="noimg"></div>${escapeHtml(title)}${weight}</div>`;
  }
  // group regular fish by their "types" tag (young / common / trophy / unique) reported per place
  const groups = {};
  (item.fishIds||[]).forEach(id=>{
    const fd = (item.fishDetails||[]).find(x=>x.id===id);
    const tags = (fd && fd.types && fd.types.length) ? fd.types : ['other'];
    // put each fish under its "highest" tag rather than every tag it has
    const priority = ['unique','trophy','common','young','other'];
    const tag = priority.find(t=>tags.includes(t)) || 'other';
    (groups[tag] = groups[tag]||[]).push(id);
  });
  const tagLabels = {unique:'Unique catches', trophy:'Trophy-sized', common:'Common catches', young:'Young / juvenile', other:'Other'};
  const order = ['unique','trophy','common','young','other'];
  const groupsHtml = order.filter(t=>groups[t]).map(t=>`
    <div style="margin-bottom:14px;">
      <div style="font-size:12.5px; color:var(--ink-dim); margin-bottom:6px;">${tagLabels[t]} <span style="opacity:.6">(${groups[t].length})</span></div>
      <div class="chip-row">${groups[t].map(fishChip).join('')}</div>
    </div>
  `).join('');
  const monsterChips = (item.monsterFishIds||[]).map(fishChip).join('');
  const pins = spreadOverlappingPins((DATA.placePins && DATA.placePins[String(item.id)]) || []);
  const pinsHtml = pins.map(p=>{
    const f = byId.fish[p.fishId];
    const name = f? f.title : ('fish #'+p.fishId);
    const openAttr = f? ` data-open="fish:${p.fishId}"` : '';
    const imgAttr = f && f.image ? ` data-fish-img="${escapeHtml(f.image)}"` : '';
    return `<div class="pin ${p.type==='trophy'?'trophy':(p.type==='unique'?'unique':'')}" style="left:${p.x}%; top:${p.y}%;" data-fish-name="${escapeHtml(name)}" data-fish-type="${escapeHtml(p.type||'common')}"${imgAttr}${openAttr}></div>`;
  }).join('');
  const svgMap = svgMapFor(item.slug);
  const mapSrc = svgMap || item.image;
  const mapId = 'mapframe-' + item.id;
  return `
    <div class="hero" style="padding:0; display:block;">
      <button class="close">&times;</button>
      <div class="map-frame" id="${mapId}">
        <div class="map-wrap">
          ${mapSrc? `<img src="${mapSrc}" onerror="this.style.display='none'">` : ''}
          ${pinsHtml}
        </div>
        <div class="zoom-controls">
          <button data-zoom="in" title="Zoom in">+</button>
          <button data-zoom="out" title="Zoom out">&minus;</button>
          <button data-zoom="reset" title="Reset">&#8634;</button>
        </div>
      </div>
      <div style="padding:20px 26px; background:linear-gradient(135deg,#123039,#0d2229);">
        <h2>${escapeHtml(item.title)}</h2>
        <div class="latin">${escapeHtml(item.locationName||'')}${item.type?' &middot; '+escapeHtml(item.type):''}</div>
        <div class="stats">
          ${item.baseLevel?`<div class="stat"><b>${item.baseLevel}</b>min. level</div>`:''}
          <div class="stat"><b>${(item.fishIds||[]).length}</b>fish species</div>
          <div class="stat"><b>${(item.monsterFishIds||[]).length}</b>trophy fish</div>
          ${pins.length? `<div class="stat"><b>${pins.length}</b>reported catch spots</div>`:''}
        </div>
      </div>
    </div>
    <div class="content">
      ${pins.length? `<div style="font-size:11.5px; color:var(--ink-dim); font-family:var(--font-mono); margin-bottom:14px;">Dots are real catch spots on this map — hover for the fish, click to open it. <span style="color:#9aa5a3;">&#9679;</span> Common &nbsp; <span style="color:#4caf6a;">&#9679;</span> Trophy &nbsp; <span style="color:#e8c94d;">&#9679;</span> Unique</div>` : ''}
      <h3 class="section">What bites here</h3>
      ${groupsHtml || '<span style="color:var(--ink-dim);font-size:12.5px;">unknown</span>'}
      ${monsterChips? `<h3 class="section">Trophy fish</h3><div class="chip-row">${monsterChips}</div>`:''}
    </div>
  `;
}

function subDetailHtml(tab, item){
  // fallback detail for a bait/lure opened from within a fish page
  const rows = [];
  if(tab==='baits'){
    if(item.baitType) rows.push(['Type', item.baitType]);
    if(item.weight) rows.push(['Weight class', item.weight]);
    if(item.targetFish) rows.push(['Target fish', item.targetFish]);
    if(item.basePrice) rows.push(['Price', item.basePrice + ' game gold']);
  }
  if(tab==='lures'){
    if(item.lureType) rows.push(['Lure type', item.lureType]);
    if(item.color) rows.push(['Color', item.color]);
    if(item.weight) rows.push(['Weight', item.weight + ' g']);
    if(item.length) rows.push(['Length', item.length + ' cm']);
    if(item.hookSize) rows.push(['Hook size', item.hookSize]);
    if(item.basePrice) rows.push(['Price', item.basePrice + ' game gold']);
  }
  return `
    <div class="hero">
      <button class="close">&times;</button>
      ${imgTag(item.image, item.title, 'width:150px;height:150px;object-fit:contain;background:#08181d;border-radius:4px;padding:8px;')}
      <div class="htext"><h2>${escapeHtml(item.title)}</h2></div>
    </div>
    <div class="content">
      <div class="spec-grid">${rows.map(r=>`<div class="spec-card"><div class="st"><div class="nm">${escapeHtml(r[0])}</div><div class="sp">${escapeHtml(r[1])}</div></div></div>`).join('')}</div>
    </div>
  `;
}

document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeDetail(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });
document.getElementById('searchBox').oninput = (e)=>{ state.query = e.target.value; render(); };

// custom pin hover card (fish thumbnail + name) instead of the plain browser tooltip
(function(){
  const tip = document.getElementById('pinTip');
  const tipImg = document.getElementById('pinTipImg');
  const tipNoImg = document.getElementById('pinTipNoImg');
  const tipName = document.getElementById('pinTipName');
  const tipType = document.getElementById('pinTipType');
  function showTip(pin, x, y){
    const name = pin.dataset.fishName || 'Unknown fish';
    const type = pin.dataset.fishType || 'common';
    const img = pin.dataset.fishImg;
    tipName.textContent = name;
    tipType.textContent = type;
    if(img){ tipImg.src = img; tipImg.style.display='block'; tipNoImg.style.display='none'; }
    else { tipImg.style.display='none'; tipNoImg.style.display='block'; }
    tip.style.left = x+'px';
    tip.style.top = y+'px';
    tip.style.display = 'flex';
  }
  document.addEventListener('mouseover', e=>{
    const pin = e.target.closest && e.target.closest('.pin');
    if(pin) showTip(pin, e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', e=>{
    const pin = e.target.closest && e.target.closest('.pin');
    if(pin){ tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; }
  });
  document.addEventListener('mouseout', e=>{
    const pin = e.target.closest && e.target.closest('.pin');
    if(pin) tip.style.display = 'none';
  });
})();
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{ state.tab = b.dataset.tab; state.query=''; state.filter=''; document.getElementById('searchBox').value=''; render(); };
});

function init(){
  const m = DATA.meta;
  document.getElementById('metaLine').textContent =
    `fish ${DATA.fish.length}/${m.fishTotal} · baits ${DATA.baits.length}/${m.baitsTotal} · lures ${DATA.lures.length}/${m.luresTotal} · maps ${DATA.places.length}/${m.placesTotal}`;
  const allDone = DATA.fish.length>=m.fishTotal && DATA.baits.length>=m.baitsTotal && DATA.lures.length>=m.luresTotal &&
    DATA.hooks.length>=m.hooksTotal && DATA.luretypes.length>=m.luretypesTotal && DATA.places.length>=m.placesTotal;
  document.getElementById('dataBanner').innerHTML = allDone
    ? `<b>Data coverage:</b> complete — fish ${DATA.fish.length}/${m.fishTotal}, baits ${DATA.baits.length}/${m.baitsTotal}, lures ${DATA.lures.length}/${m.luresTotal}, hooks ${DATA.hooks.length}/${m.hooksTotal}, lure types ${DATA.luretypes.length}/${m.luretypesTotal}, maps ${DATA.places.length}/${m.placesTotal}.`
    : `<b>Data coverage:</b> fish ${DATA.fish.length}/${m.fishTotal}, baits ${DATA.baits.length}/${m.baitsTotal}, lures ${DATA.lures.length}/${m.luresTotal}, hooks ${DATA.hooks.length}/${m.hooksTotal}, lure types ${DATA.luretypes.length}/${m.luretypesTotal}, maps ${DATA.places.length}/${m.placesTotal}.`;
  render();
}
</script>
